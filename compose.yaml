# Start with ./up.sh rather than `docker compose up` directly: it fills in
# PUID/PGID/DATA_DIR from the invoking user and validates .env first.
#
# Both services use the host's network, so 127.0.0.1 inside them is the host:
# a TMDB proxy on the host is set as http://127.0.0.1:<port>, as without
# Docker. The backend listens on 127.0.0.1:BACKEND_PORT only; nginx serves
# HTTPS_PORT and forwards /api to it.
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: ghcr.io/shengt25/ptmm-backend:latest
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    network_mode: host
    environment:
      HOME: /tmp
      BACKEND_PORT: "${BACKEND_PORT:-8000}"
      DB_PATH: /data/ptmm.db
      TMDB_API_KEY: "${TMDB_API_KEY}"
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      AUTH_USERNAME: "${AUTH_USERNAME:-}"
      AUTH_PASSWORD_HASH: "${AUTH_PASSWORD_HASH:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
      UMASK: "${UMASK:-002}"
    volumes:
      # ptmm.db plus its rotating backups in bak/.
      - "${DATA_DIR:-${HOME}/.config/ptmm}:/data"
      # The whole disk as one mount: hard links fail across container mounts
      # even on the same disk. Same path as on the host, since the DB stores
      # absolute paths.
      - "${MEDIA_DISK_MOUNT}:${MEDIA_DISK_MOUNT}"
    command:
      - /bin/sh
      - -c
      - |
        umask "$${UMASK}"
        exec uvicorn app.main:app --host 127.0.0.1 --port "$${BACKEND_PORT}" --workers 1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen(f"http://127.0.0.1:{os.environ['BACKEND_PORT']}/openapi.json", timeout=2)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: ghcr.io/shengt25/ptmm-web:latest
    depends_on:
      backend:
        condition: service_healthy
    network_mode: host
    environment:
      HTTPS_PORT: "${HTTPS_PORT:-8443}"
      BACKEND_PORT: "${BACKEND_PORT:-8000}"
      CERT_FULLCHAIN_FILE: "${CERT_FULLCHAIN_FILE:-fullchain.pem}"
      CERT_KEY_FILE: "${CERT_KEY_FILE:-privkey.pem}"
      CERT_RELOAD_INTERVAL: "${CERT_RELOAD_INTERVAL:-3600}"
    volumes:
      # The whole directory, not the individual files: renewal tools usually
      # replace files by rename, and a single-file bind mount would keep
      # pointing at the old inode forever.
      - "${CERT_DIR}:/certs:ro"
    restart: unless-stopped
